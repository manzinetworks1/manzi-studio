name: 2 - Make videos
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder (leave empty for the newest)"
        required: false
        default: ""
      no_ai:
        description: "Make the videos without the AI scenes / Professor voice"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Which week
        id: week
        run: |
          W="${{ github.event.inputs.week }}"; [ -z "$W" ] && W=$(ls weeks | sort | tail -1)
          echo "week=$W" >> "$GITHUB_OUTPUT"; echo "Week: $W"
      - name: AI scenes and Professor voice (Manzi Engine on Kaggle)
        id: ai
        run: |
          git config user.name "Manzi Studio"; git config user.email "manzi-studio@users.noreply.github.com"
          python pipeline/engine_week.py --week "${{ steps.week.outputs.week }}" ${{ github.event.inputs.no_ai == 'true' && '--no-ai' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell me the AI part is on its way
        if: steps.ai.outputs.ai == 'sent'
        run: |
          python -c "import sys; sys.path.insert(0,'pipeline'); import mail, common; mail.send(common.config(), '[Manzi Studio] Making the AI scenes for week ${{ steps.week.outputs.week }}', '<p>✅ Scripts approved. The opening scenes, the Professor clips and the Professor voice are being made on Kaggle\'s free GPU now.</p><p>When they are ready, the videos are made automatically and you get the usual <b>videos ready</b> email. If Kaggle is too busy for more than 4 hours, the videos are made without the AI part so nothing is late.</p>')"
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - if: steps.ai.outputs.ai != 'sent'
        run: python pipeline/make.py --week "${{ steps.week.outputs.week }}" ${{ steps.ai.outputs.ai == 'off' && '--no-ai' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell me if something went wrong
        if: failure()
        run: |
          python -c "import sys; sys.path.insert(0,'pipeline'); import mail, common, os; mail.send(common.config(), '[Manzi Studio] Something went wrong', '<p>The job <b>${{ github.workflow }}</b> failed. Open <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">this run</a>, tap the red step and send Claude a screenshot.</p>')"
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
