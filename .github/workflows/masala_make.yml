name: M - Make masala short
# Masala Shorts (Entertainment With Manzi). Starts by itself when you paste a story file into masala/inbox/
# (GitHub → masala/inbox → Add file → Create new file → paste → Commit). It checks the file (an email lists anything
# to fix), sends the AI clips to Kaggle, and when they are back (started again by '3b - Collect') puts the Short
# together and emails you "Short ready".
on:
  push:
    branches: [main]
    paths: ["masala/inbox/**"]
  workflow_dispatch:
    inputs:
      story:
        description: "Story code (slug). Leave empty to check the inbox"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: masala-make
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the pasted story files
        id: inbox
        run: |
          git config user.name "Manzi Studio"; git config user.email "manzi-studio@users.noreply.github.com"
          S="${{ github.event.inputs.story }}"
          if [ -n "$S" ]; then echo "stories=$S" >> "$GITHUB_OUTPUT"; else python masala/intake.py; fi
      - name: AI clips (Manzi Engine on Kaggle)
        id: ai
        if: steps.inbox.outputs.stories != ''
        run: |
          git config user.name "Manzi Studio"; git config user.email "manzi-studio@users.noreply.github.com"
          READY=""
          for S in ${{ steps.inbox.outputs.stories }}; do
            : > ai.txt
            GITHUB_OUTPUT=ai.txt python masala/job.py --story "$S"
            STATE=$(sed -n 's/^ai=//p' ai.txt)
            echo "$S: $STATE"
            if [ "$STATE" = "ready" ]; then READY="$READY $S"
            else python masala/mail_started.py "$S" "$STATE"; fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - name: Install the video tools
        if: steps.ai.outputs.ready != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
          python -m playwright install --with-deps chromium
      - name: Put the Short together and deliver it
        if: steps.ai.outputs.ready != ''
        run: |
          for S in ${{ steps.ai.outputs.ready }}; do python masala/make.py --story "$S"; done
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      - name: Tell me if something went wrong
        if: failure()
        run: |
          python -c "import sys; sys.path.insert(0,'pipeline'); import mail, common; mail.send(common.config(), '[Manzi Studio] Something went wrong', '<p>The job <b>${{ github.workflow }}</b> failed. Open <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">this run</a>, tap the red step and send Claude a screenshot.</p>')"
