name: 3 - Manzi Engine (Kaggle GPU)

# Sends a job (scenes + narration) to Kaggle's free GPU T4 x2, waits for it, and puts the results on a Release.
# Needs repository secrets KAGGLE_USERNAME and KAGGLE_KEY (kaggle.com → Settings → API → Create New Token).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file in engine/jobs/"
        default: "step1_test.json"
        required: true
      wait_minutes:
        description: "How long this run waits for Kaggle before handing over to '3b - Collect'"
        default: "120"
        required: true
      then_make:
        description: "Week to make videos for when the results are in (set by '2 - Make videos')"
        default: ""
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: manzi-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      KERNEL: ${{ secrets.KAGGLE_USERNAME }}/manzi-engine
      MANZI_KERNEL_ID: ${{ secrets.KAGGLE_USERNAME }}/manzi-engine
      GH_TOKEN: ${{ github.token }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the Manzi Engine busy with another run?
        id: busy
        run: |
          # Kaggle keeps only one run of the engine notebook: a second job waits until the first one is collected
          if [ -f engine/state/pending.json ]; then
            RUN_ID=$(python3 -c "import json;print(json.load(open('engine/jobs/${{ inputs.job }}'))['run_id'])")
            python3 -c "import json,time;json.dump({'job':'${{ inputs.job }}','week':'${{ inputs.then_make }}','created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())},open('engine/state/waiting-$RUN_ID.json','w'),indent=2)"
            git config user.name "manzi-studio-bot"
            git config user.email "actions@users.noreply.github.com"
            git add engine/state
            git commit -q -m "Manzi Engine busy: job ${{ inputs.job }} waits" || true
            git pull -q --rebase
            git push -q
            echo "busy=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Another engine run is still waiting to be collected; '3c - Send the waiting AI job' sends this one later."
          fi

      - uses: actions/setup-python@v5
        if: steps.busy.outputs.busy != 'yes'
        with:
          python-version: "3.12"

      - name: Install the Kaggle tool
        if: steps.busy.outputs.busy != 'yes'
        run: pip install -q "kaggle>=1.7.4" six

      - name: Check the Kaggle secrets
        if: steps.busy.outputs.busy != 'yes'
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::Add the KAGGLE_USERNAME and KAGGLE_KEY secrets (repo Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Freeze AIQUEST's notebook (first run only)
        if: steps.busy.outputs.busy != 'yes'
        run: |
          if [ ! -f engine/vendor/aiquest_h3.ipynb ]; then
            mkdir -p /tmp/aiq
            kaggle kernels pull unlockbulk/minimax-h3-open-h3-regenerate-2k -p /tmp/aiq
            mkdir -p engine/vendor
            cp /tmp/aiq/*.ipynb engine/vendor/aiquest_h3.ipynb
            git config user.name "manzi-studio-bot"
            git config user.email "actions@users.noreply.github.com"
            git add engine/vendor/aiquest_h3.ipynb
            git commit -m "Freeze AIQUEST MiniMax H3 notebook (Apache 2.0) for the Manzi Engine"
            git push
          fi

      - name: Files from earlier runs (approved drafts)
        if: steps.busy.outputs.busy != 'yes'
        id: inputs
        run: python engine/stage_latents.py "engine/jobs/${{ inputs.job }}"

      - name: Build the Kaggle job
        if: steps.busy.outputs.busy != 'yes'
        run: |
          DS="${{ steps.inputs.outputs.dataset }}"
          python engine/build_kernel.py "engine/jobs/${{ inputs.job }}" build ${DS:+--gpu-dataset $DS}
          RUN_ID=$(python -c "import json;print(json.load(open('engine/jobs/${{ inputs.job }}'))['run_id'])")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Send the job to Kaggle (GPU T4 x2)
        if: steps.busy.outputs.busy != 'yes'
        run: |
          kaggle kernels push -p build --accelerator NvidiaTeslaT4 2>&1 | tee push.log || true
          if ! grep -qi "successfully" push.log && grep -qi "unrecognized arguments" push.log; then
            echo "Older Kaggle tool: pushing without --accelerator (kernel-metadata asks for T4)"
            kaggle kernels push -p build 2>&1 | tee push.log || true
          fi
          grep -qi "successfully" push.log || { echo "::error::Kaggle did not accept the job (see the lines above)"; exit 1; }
          mkdir -p engine/state
          printf '{"run_id": "%s", "job": "%s", "pushed_at": "%s", "then_make": "%s"}\n' "$RUN_ID" "${{ inputs.job }}" "$(date -u +%FT%TZ)" "${{ inputs.then_make }}" > engine/state/pending.json
          git config user.name "manzi-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/state/pending.json
          git commit -q -m "Manzi Engine: run $RUN_ID sent to Kaggle" || true
          git pull -q --rebase
          git push -q

      - name: Wait for Kaggle
        if: steps.busy.outputs.busy != 'yes'
        id: wait
        run: |
          end=$(( $(date +%s) + ${{ inputs.wait_minutes }} * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            status=$(kaggle kernels status "$KERNEL" 2>&1 | tr 'A-Z' 'a-z')
            echo "$(date -u +%T) $status"
            case "$status" in
              *complete*) echo "state=complete" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *error*|*cancel*) echo "state=error" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 120
          done
          echo "state=waiting" >> "$GITHUB_OUTPUT"
          echo "Still running on Kaggle; '3b - Collect engine results' will pick it up."

      - name: Collect the results
        if: steps.wait.outputs.state == 'complete' || steps.wait.outputs.state == 'error'
        run: python engine/collect.py

  # The same collector runs on a schedule in collect.yml for runs that outlast the wait above.
