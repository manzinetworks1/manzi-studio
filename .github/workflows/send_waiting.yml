name: 3c - Send the waiting AI job (11 am India time)

# Weekly AI jobs wait for Kaggle's quiet hours (late night in the USA). This sends a waiting job at 11:00 am IST.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"      # 05:30 UTC = 11:00 am India time

permissions:
  contents: write
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Send the job if one is waiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 engine/send_waiting.py
